<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobHunt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f5f6f9; --card:#ffffff; --line:#e7e9f0; --line2:#eef0f5; --txt:#161c2d; --mut:#6b7488;
      --pri:#6366f1; --pri-d:#4f46e5; --pri-soft:#eef0fe;
      --acc:#10b981; --acc-d:#059669; --acc-soft:#d5f5e9;
      --side:#0f1524; --side2:#1b2338; --sidetxt:#aeb6cc; --sidemut:#69728c; --sidehov:#1b2338;
      --warn:#946200; --warn-bg:#fff2d1; --err:#c0362c; --err-bg:#fde7e5;
      --sh1:0 1px 2px rgba(16,24,40,.05); --sh2:0 4px 14px rgba(16,24,40,.08);
      --r:12px;
    }
    :root[data-theme="dark"]{
      --bg:#0d1220; --card:#151b2b; --line:#242d44; --line2:#1e2537; --txt:#e7eaf2; --mut:#8b93a9;
      --pri:#7c83ff; --pri-d:#8b93f8; --pri-soft:#1f2742;
      --acc:#2dd4a7; --acc-d:#34d399; --acc-soft:#123a30;
      --side:#080c16; --side2:#161d30; --sidetxt:#aeb6cc; --sidemut:#69728c; --sidehov:#161d30;
      --warn:#e3b341; --warn-bg:#3a2f12; --err:#f87171; --err-bg:#3a1c1c;
      --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 20px rgba(0,0,0,.4);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:14px;line-height:1.55;transition:background .25s,color .25s}
    a{color:var(--pri);text-decoration:none;cursor:pointer}a:hover{text-decoration:none}
    .icon{display:inline-block;vertical-align:-3px;flex:0 0 auto}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

    .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:9px 15px;font-size:14px;
      font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s,filter .15s,background .15s}
    .btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6;cursor:progress}
    .btn.primary{background:var(--pri);color:#fff}.btn.accent{background:var(--acc);color:#fff}
    .btn.outline{background:transparent;color:var(--txt);border:1px solid var(--line)}
    .btn.block{width:100%;justify-content:center}.btn.big{padding:12px;font-size:15px}
    .chip{display:inline-flex;align-items:center;gap:5px;background:var(--line2);color:var(--mut);border-radius:20px;
      padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
    .chip.live{background:var(--acc-soft);color:var(--acc-d)}
    .chip.src{background:var(--line2);color:var(--mut);font-size:11px;padding:1px 8px}
    .chip.match{background:var(--line2);color:var(--mut);font-weight:700}
    .chip.match.good{background:var(--acc-soft);color:var(--acc-d)}
    .chip.match.mid{background:var(--warn-bg);color:var(--warn)}
    .uploadzone{border:2px dashed var(--line);border-radius:16px;padding:36px 20px;text-align:center;cursor:pointer;
      background:var(--card);transition:border-color .15s,background .15s}
    .uploadzone:hover,.uploadzone.drag{border-color:var(--pri);background:var(--pri-soft)}
    .uz-ic{color:var(--pri);margin-bottom:8px}
    .uz-title{font-size:16px;font-weight:600}.uz-sub{font-size:13px;color:var(--mut);margin-top:3px}
    .resume-info{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
      font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .resume-info.err{border-color:var(--err);color:var(--err)}
    .inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;
      font-family:inherit;background:var(--bg);color:var(--txt);transition:border .15s,box-shadow .15s}
    .inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
    .muted{color:var(--mut)}

    /* ---------- layout ---------- */
    .layout{display:flex;min-height:100vh}
    .sidebar{width:238px;flex:0 0 238px;background:var(--side);color:var(--sidetxt);position:fixed;inset:0 auto 0 0;
      display:flex;flex-direction:column;padding:18px 13px;z-index:20}
    .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;color:#fff;padding:6px 10px 18px}
    .logo .icon{color:#8b93f8}
    .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
    .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sidetxt);
      font-weight:500;font-size:14.5px;transition:background .15s,color .15s}
    .nav-item:hover{background:var(--sidehov);color:#fff}
    .nav-item.active{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
    .nav-badge{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;font-size:11px;font-weight:700;padding:1px 8px}
    .nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sidemut);margin:16px 12px 6px}
    .side-foot{border-top:1px solid var(--side2);padding-top:13px;margin-top:8px;display:flex;flex-direction:column;gap:11px}
    .btn.refresh{background:var(--side2);color:#dbe0ee}
    .urow{display:flex;align-items:center;gap:10px;padding:0 4px}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
      font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .uemail{font-size:12px;color:#dbe0ee;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .urow a{font-size:11px;color:var(--sidemut)}

    .content{margin-left:238px;flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:1px solid var(--line);
      padding:14px 26px;position:sticky;top:0;z-index:15}
    .topbar h1{margin:0;font-size:20px;font-weight:700}
    .top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
    .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);
      display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
    .icon-btn:hover{background:var(--line2)}
    .view{padding:22px 26px}
    .page{animation:fadeInUp .35s ease both}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* ---------- stat cards ---------- */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:20px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:13px;
      align-items:center;box-shadow:var(--sh1);transition:transform .15s,box-shadow .15s}
    .stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
    .stat-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .stat-val{font-size:25px;font-weight:800;line-height:1.05}
    .stat-lbl{font-size:12.5px;color:var(--mut);margin-top:1px}
    .stat-sub{font-size:11px;color:var(--acc-d);font-weight:700;margin-top:2px}

    /* ---------- charts ---------- */
    .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh1)}
    .chart-card.wide{grid-column:1/-1}
    .chart-title{font-size:14px;font-weight:600;margin-bottom:15px;display:flex;align-items:center;gap:8px}
    .bars{display:flex;flex-direction:column;gap:9px}
    .bar-row{display:flex;align-items:center;gap:10px}
    .bar-label{flex:0 0 128px;font-size:12.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{flex:1;background:var(--line2);border-radius:6px;height:17px;overflow:hidden}
    .bar-fill{height:100%;border-radius:6px;min-width:3px;transform-origin:left;animation:growBar .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .bar-val{flex:0 0 42px;font-size:12px;font-weight:700;color:var(--mut);text-align:right}
    .donut-wrap{display:flex;align-items:center;gap:22px;justify-content:center;padding:6px 0}
    .donut{width:158px;height:158px}
    .donut circle.fg{animation:dash 1s ease both}
    @keyframes dash{from{stroke-dasharray:0 999}}
    .donut-num{font-size:26px;font-weight:800;fill:var(--txt)}.donut-lbl{font-size:11px;fill:var(--mut)}
    .donut-legend div{margin:8px 0;display:flex;align-items:center;gap:9px;font-size:13.5px}
    .dot{width:12px;height:12px;border-radius:4px;display:inline-block}
    .chart-empty{color:var(--mut);text-align:center;padding:22px}
    .cols{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:8px}
    .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
    .col-bar{width:66%;background:linear-gradient(180deg,#6366f1,#8b5cf6);border-radius:5px 5px 0 0;min-height:4px;
      transform-origin:bottom;animation:growH .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes growH{from{transform:scaleY(0)}}
    .col-lbl{font-size:9.5px;color:var(--mut);margin-top:6px;white-space:nowrap}

    /* ---------- filters / jobs ---------- */
    .filter-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh1);margin-bottom:18px}
    .frow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.frow:last-child{margin-bottom:0}
    .frow .inp{flex:1;min-width:150px}
    .ticks{align-items:center}
    .tick{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
    .tick input{width:16px;height:16px;accent-color:var(--pri)}
    .roles{align-items:center;gap:6px}
    .rlabel{font-size:12px;color:var(--mut);font-weight:600;margin-right:2px}
    .rolechip{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:20px;padding:5px 13px;
      font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
    .rolechip:hover{border-color:var(--pri);color:var(--pri)}
    .rolechip.active{background:var(--pri);color:#fff;border-color:var(--pri)}
    .sel{cursor:pointer}.frow .sel{min-width:130px;flex:1}
    details.sources summary{cursor:pointer;font-size:13px;color:var(--pri);font-weight:600;padding:4px 0}
    .techlist{max-height:190px;overflow:auto;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:1px 14px}
    .tcat{grid-column:1/-1;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mut);margin-top:8px}
    .tk{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0}.tk.off{opacity:.5}.tk input{accent-color:var(--pri)}
    .badge{margin-left:auto;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px}
    .badge.key{background:var(--warn-bg);color:var(--warn)}.badge.scr{background:var(--err-bg);color:var(--err)}

    .resbar{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}.resbar b{font-size:17px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:15px 17px;
      margin-bottom:12px;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
    .card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--pri)}
    .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .title{font-size:16px;font-weight:600;line-height:1.35;color:var(--txt)}
    .card:hover .title{color:var(--pri)}
    .card-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
    .src-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid;white-space:nowrap;flex:0 0 auto}
    .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
    .foot-date{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}
    .pill-rem{background:var(--acc-soft);color:var(--acc-d);padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
    .btn-save{display:flex;align-items:center;gap:5px;border:1px solid var(--acc);background:transparent;color:var(--acc-d);
      border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
    .btn-save.on{background:var(--acc);color:#fff}
    .meta{font-size:13px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .tags{margin:9px 0 2px;display:flex;flex-wrap:wrap;gap:5px}
    .tag{background:var(--line2);color:var(--mut);font-size:11px;padding:2px 9px;border-radius:20px}
    .snip{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.55}
    .empty{text-align:center;color:var(--mut);padding:52px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}

    /* ---------- skeleton ---------- */
    .sk{background:linear-gradient(90deg,var(--line2) 25%,var(--line) 37%,var(--line2) 63%);background-size:400% 100%;
      animation:shimmer 1.4s ease infinite;border-radius:7px}
    @keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
    .sk-title{height:16px;width:55%;margin-bottom:12px}.sk-line{height:11px;width:80%;margin-bottom:8px}.sk-line.short{width:45%}
    .sk-stat{height:78px;border-radius:var(--r)}.sk-chart{height:210px;border-radius:var(--r)}

    /* ---------- toast ---------- */
    #toast{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:10px}
    .toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;
      padding:12px 16px;box-shadow:var(--sh2);font-size:13.5px;font-weight:500;min-width:200px;
      display:flex;align-items:center;gap:9px;animation:toastIn .3s ease both}
    .toast.err{border-left-color:var(--err)}
    @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

    /* ---------- modal ---------- */
    #modal{position:fixed;inset:0;z-index:50;display:none}
    #modal.open{display:block}
    .modal-backdrop{position:absolute;inset:0;background:rgba(10,14,24,.55);animation:fadeIn .2s ease both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-panel{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--card);
      box-shadow:-10px 0 40px rgba(0,0,0,.25);padding:26px 28px;overflow:auto;animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
    .modal-x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
      background:var(--bg);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .modal-panel h2{margin:6px 0 4px;font-size:21px;padding-right:40px}
    .modal-sub{color:var(--mut);font-weight:500;margin-bottom:12px}
    .modal-desc{font-size:14px;line-height:1.7;color:var(--txt);margin:14px 0;white-space:pre-wrap}
    .modal-actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;background:var(--card);padding-top:12px}

    /* ---------- auth ---------- */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:radial-gradient(900px 420px at 50% -10%,var(--pri-soft),transparent)}
    .auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:36px 32px;width:400px;max-width:100%;animation:fadeInUp .4s ease both}
    .auth-brand{display:flex;align-items:center;justify-content:center;gap:9px;font-size:26px;font-weight:800}.auth-brand .icon{color:var(--pri)}
    .auth-sub{text-align:center;color:var(--mut);margin:6px 0 22px}
    .auth-card .inp{margin-bottom:14px;padding:12px}
    .auth-toggle{text-align:center;margin-top:16px;color:var(--mut)}.auth-toggle a{font-weight:600}
    .a-err{background:var(--err-bg);color:var(--err);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
    .a-err.show{display:block}
    .auth-hint{background:var(--pri-soft);color:var(--pri-d);border-radius:10px;padding:8px 12px;font-size:12.5px;text-align:center}

    @media(max-width:860px){
      .sidebar{position:static;width:100%;flex:none;flex-direction:row;align-items:center;padding:9px 12px;overflow-x:auto}
      .logo{padding:0 6px 0 0}.nav{flex-direction:row;gap:2px}.nav-sec{display:none}.nav-item{padding:8px 10px}.nav-item span{display:none}
      .side-foot{border:0;margin:0;padding:0;flex-direction:row}.side-foot .btn.refresh span{display:none}.uemail{display:none}
      .content{margin-left:0}.charts-grid{grid-template-columns:1fr}.modal-panel{width:100vw}
    }
  </style>
</head>
<body>
  <div id="screen"><div class="empty" style="margin:40vh auto;max-width:200px;border:0">Loading…</div></div>
  <div id="modal"></div>
  <div id="toast"></div>

  <script>
  window.addEventListener('error', function (e) {
    var s = document.getElementById('screen');
    if (s) s.innerHTML = '<pre style="color:#c0362c;padding:24px;white-space:pre-wrap;font-family:monospace">Error: '
      + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre>';
  });

  /* ---------------- icons (inline SVG, no dependency) ---------------- */
  const ICONS = {
    dashboard:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/>',
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12a20 20 0 0 0 18 0"/>',
    bookmark:'<path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3-5 3V6a2 2 0 0 1 2-2z"/>',
    world:'<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/>',
    building:'<path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M15 9h2a2 2 0 0 1 2 2v10"/><path d="M8 7h2M8 11h2M8 15h2"/>',
    shuffle:'<path d="M18 4l3 3-3 3"/><path d="M18 20l3-3-3-3"/><path d="M3 7h3c3 0 5 3 6.5 6S15 19 18 19h3"/><path d="M3 17h3c1.5 0 2.8-.7 3.8-2M14 8c1-1.3 2.3-2 3.8-2H21"/>',
    search:'<circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/>',
    refresh:'<path d="M20 11a8 8 0 0 0-15-2.5"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 15 2.5"/><path d="M20 19v-4h-4"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
    moon:'<path d="M12 3a7 7 0 1 0 9 9 7.5 7.5 0 0 1-9-9z"/>',
    pin:'<path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
    external:'<path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9"/><path d="M15 4h5v5"/>',
    star:'<path d="M12 3l2.9 5.9 6.1.9-4.5 4.3 1.1 6.1L12 17.8 6.4 20.3l1.1-6.1L3 9.8l6.1-.9z"/>',
    x:'<path d="M18 6L6 18M6 6l12 12"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    sparkles:'<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',

  function barChart(data){

    return '<div class="bars">'+data.map((d,i)=>`<div class="bar-row"><div class="bar-label" title="${esc(d[0])}">${esc(d[0])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d[1]/max*100)}%;background:${PALETTE[i%PALETTE.length]}"></div></div>
      <div class="bar-val">${d[1]}</div></div>`).join('')+'</div>';
  }
  function columnChart(data){
    if(!data||!data.length) return '<div class="chart-empty">Not enough date data (some sources omit dates)</div>';
    const max=Math.max.apply(null,data.map(d=>d[1]))||1;
    return '<div class="cols">'+data.map(d=>`<div class="col" title="${esc(String(d[0]))}: ${d[1]}">

    try{ const r=await api('/refresh',POST({techniques:keys,q:f.q,location:f.location})); S.stats.total_jobs=r.stored_total; toast('New jobs added ('+r.stored_total+' total)'); }
    catch(e){ toast('Refresh failed',true); }
    if(btn){btn.disabled=false; btn.innerHTML=icon('refresh',16)+'<span>Fetch from internet</span>';}
    renderTopStats(); await loadAnalytics(); router();
  }

  /* ---------------- SAVED ---------------- */
  async function loadSaved(){ try{S.saved=await api('/saved');S.savedIds=new Set(S.saved.map(j=>j.id));}catch(e){} renderTopStats(); }
  async function toggleSave(id){
    const pool=S.nav==='saved'?S.saved:S.jobs, wasSaved=S.savedIds.has(id), job=[...S.jobs,...S.saved].find(j=>j.id===id);
    try{ if(wasSaved) await api('/saved/'+encodeURIComponent(id),{method:'DELETE'}); else if(job) await api('/saved',POST({job}));
      await loadSaved(); toast(wasSaved?'Removed from saved':'Job saved ✓');
      const cur=(location.hash||'').replace(/^#\/?/,'').split('/')[0];
      if(cur==='saved') renderSaved(); else renderList(S.jobs,S.matched);
    }catch(e){ toast('Failed',true); }
  }
  function renderSaved(){
    $('view').innerHTML=`<div class="page"><div class="resbar"><b>${icon('bookmark',18)} Saved jobs</b><span class="muted">${S.saved.length} jobs</span></div><div id="results"></div></div>`;
    renderList(S.saved,false);
  }

  /* ---------------- RESUME → ATS ---------------- */
  async function renderResume(){
    $('view').innerHTML=`<div class="page">
      <div class="uploadzone" id="uploadzone" onclick="$('resume-file').click()">
        <div class="uz-ic">${icon('upload',36)}</div>
        <div class="uz-title">Drop your resume PDF here</div>
        <div class="uz-sub">or click to browse · PDF only</div>
        <input type="file" id="resume-file" accept="application/pdf,.pdf" style="display:none" onchange="uploadResume(this.files[0])">
      </div>
      <div id="resume-status"></div>
      <div id="resume-insights"></div>
      <div class="resbar" style="margin-top:18px"><b>${icon('sparkles',18)} Jobs by ATS score</b><span class="muted" id="res-count"></span></div>
      <div id="results"><div class="empty">Upload your resume → all jobs get <b>ATS score</b> ranked by ATS score (best matches first).</div></div>
    </div>`;
    const uz=$('uploadzone');
    uz.ondragover=e=>{e.preventDefault();uz.classList.add('drag');};
    uz.ondragleave=()=>uz.classList.remove('drag');
    uz.ondrop=e=>{e.preventDefault();uz.classList.remove('drag'); if(e.dataTransfer.files[0]) uploadResume(e.dataTransfer.files[0]);};
    try{ const info=await api('/resume'); if(info.has){ $('resume-status').innerHTML=resumeInfoHTML(info);
      showResumeInsights(); showResumeJobs(await api('/resume/match')); } }catch(e){}
  }
  async function showResumeInsights(){
    const box=$('resume-insights'); if(!box) return;
    let d={}; try{ d=await api('/resume/insights'); }catch(e){}
    if(!d.has){ box.innerHTML=''; return; }
    box.innerHTML=`<div class="charts-grid" style="margin:16px 0">
      <div class="chart-card"><div class="chart-title">${icon('sparkles',16)} Skill gap — learn these to match more</div>${barChart(d.skill_gap)}</div>
      <div class="chart-card"><div class="chart-title">${icon('layers',16)} ATS score distribution (${d.strong} strong)</div>${barChart(d.ats_distribution)}</div>
      <div class="chart-card wide"><div class="chart-title">${icon('building2',16)} Best-match companies (for you)</div>${barChart(d.best_companies)}</div>
    </div>`;
  }
  function resumeInfoHTML(info){
    return `<div class="resume-info">${icon('file',18)} <b>${esc(info.filename||'resume.pdf')}</b> · ${info.chars} chars analyzed
      · <a onclick="$('resume-file').click()">Re-upload</a></div>`;
  }
  async function uploadResume(file){
    if(!file) return;
    if(!(file.name||'').toLowerCase().endsWith('.pdf')) return toast('Please upload a PDF',true);
    $('resume-status').innerHTML=`<div class="resume-info">${icon('file',18)} ${esc(file.name)} — analyzing…</div>`;
    if($('results'))$('results').innerHTML=skelCards(6);
    const fd=new FormData(); fd.append('file',file);
    try{
      const r=await fetch('/api/resume/upload',{method:'POST',headers:{Authorization:'Bearer '+S.token},body:fd});
      const d=await r.json(); if(!r.ok) throw new Error(d.detail||'upload fail');
      $('resume-status').innerHTML=resumeInfoHTML(d); showResumeInsights(); showResumeJobs(d.jobs);
      toast('Resume analyzed ✓ — '+d.jobs.length+' jobs ranked');
    }catch(e){ $('resume-status').innerHTML=`<div class="resume-info err">${icon('x',16)} ${esc(e.message)}</div>`;
      if($('results'))$('results').innerHTML=''; toast(e.message,true); }
  }
  function showResumeJobs(jobs){
    jobs=jobs||[]; if($('res-count'))$('res-count').textContent=jobs.length+' jobs';
    const box=$('results'); if(!box) return;
    if(!jobs.length){ box.innerHTML='<div class="empty">No jobs found — fetch jobs first (↻ Fetch from internet).</div>'; return; }
    box.innerHTML=jobs.map(j=>cardHTML(j,true)).join('');
  }

  /* ---------------- ADMIN ---------------- */
  function renderAdmin(){
    if(!S.adminUnlocked){
      $('view').innerHTML=`<div class="page"><div class="filter-card" style="max-width:430px;margin:24px auto;text-align:center">
        <div style="color:var(--pri);margin-bottom:8px">${icon('shield',44)}</div>
        <h2 style="margin:0 0 4px">Admin panel</h2>
        <p class="muted" style="margin:0 0 18px">Destructive actions (clearing jobs) require the admin password.</p>
        <input id="admin-pw" class="inp" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminUnlock()">
        <button class="btn primary block big" style="margin-top:12px" onclick="adminUnlock()">${icon('lock',16)} Unlock</button>
        <p class="muted" style="font-size:11.5px;margin-top:14px">Default: <b>admin123</b> &middot; change via <code>ADMIN_PASSWORD</code> env</p>
      </div></div>`;
      return;
    }
    $('view').innerHTML=`<div class="page">
      <div class="chart-card" style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div class="stat-ic" style="background:#10b9811f;color:#10b981">${icon('shield',22)}</div>
        <div><b>Admin unlocked</b><div class="muted" style="font-size:12.5px">Vector DB currently has <b>${S.stats.total_jobs}</b> jobs</div></div>
        <button class="btn outline" style="margin-left:auto" onclick="S.adminUnlocked=false;renderAdmin()">${icon('lock',15)} Lock</button>
      </div>
      <div class="chart-card" style="border:2px solid var(--err)">
        <div class="chart-title" style="color:var(--err)">${icon('trash',16)} Danger zone</div>
        <p class="muted" style="margin:0 0 12px">These actions delete <b>ALL jobs</b> from the vector DB. Enter a reason, then choose.</p>
        <input id="admin-reason" class="inp" placeholder="Reason (e.g. stale data, fresh start)" style="margin-bottom:12px">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" style="background:var(--err);color:#fff" onclick="adminClear()">${icon('trash',16)} Clear all jobs</button>
          <button class="btn primary" onclick="adminRebuild()">${icon('refresh',16)} Clear + fetch fresh</button>
        </div>
      </div></div>`;
  }
  async function adminUnlock(){
    const pw=($('admin-pw')||{}).value||'';
    try{ const r=await api('/admin/verify',POST({password:pw}));
      if(r.ok){ S.adminUnlocked=true; S.adminPw=pw; toast('Admin unlocked ✓'); renderAdmin(); }
      else toast('Wrong admin password',true);
    }catch(e){ toast('Failed',true); }
  }
  async function adminClear(){
    if(!confirm('Are you sure? All '+S.stats.total_jobs+' jobs will be permanently deleted from the vector DB.')) return;
    try{ const r=await api('/admin/clear',POST({password:S.adminPw,reason:($('admin-reason')||{}).value||''}));
      S.stats.total_jobs=r.total; S.analytics=null; renderTopStats(); renderModeBadges();
      toast(r.cleared+' jobs cleared'); renderAdmin();
    }catch(e){ toast(e.message,true); }
  }
  async function adminRebuild(){
    if(!confirm('Are you sure? Old jobs will be deleted and fresh ones (free sources) fetched — this takes a moment.')) return;
    toast('Clearing + fetching fresh… please wait');
    try{ const r=await api('/admin/rebuild',POST({password:S.adminPw,reason:($('admin-reason')||{}).value||''}));
      S.stats.total_jobs=r.stored_total; S.analytics=null; await loadAnalytics(); renderTopStats();
      toast('Done! '+r.added+' fresh jobs added'); renderAdmin();
    }catch(e){ toast(e.message,true); }
  }

  /* ---------------- CARDS + MODAL ---------------- */
  function renderList(list, matched){
    const box=$('results'); if(!box) return;
    if(!list.length){ box.innerHTML=`<div class="empty">No jobs found — change filters or click ${icon('refresh',15)} Fetch from internet.</div>`; return; }
    box.innerHTML = list.map(j=>cardHTML(j,matched)).join('');
  }
  const SRC_COLOR={Indeed:'#2557a7',LinkedIn:'#0a66c2',Glassdoor:'#0caa41','Google Jobs':'#4285f4',
    Greenhouse:'#24a47c',Lever:'#5f4bb6',Ashby:'#6366f1',RemoteOK:'#ff4742','We Work Remotely':'#1a73e8',
    Remotive:'#3b82f6',Jobicy:'#e0518d',Himalayas:'#0ea5e9','Working Nomads':'#14b8a6','The Muse':'#d97706',
    SmartRecruiters:'#0aa0d9',Arbeitnow:'#8b5cf6',Bayt:'#e11d48','Naukri':'#ff7555',ZipRecruiter:'#16a34a',
    "HN Who's Hiring":'#ff6600','Reddit r/forhire':'#ff4500',Jobspresso:'#00a19a',Adzuna:'#00b3a4'};
  const srcColor=(s)=>SRC_COLOR[s]||'#6b7280';
  function cardHTML(j, matched){
    const saved=S.savedIds.has(j.id), showMatch=matched&&j.match!=null, sc=srcColor(j.source);
    const salv=j.salary_max||j.salary_min, sal=(salv>=10000&&salv<=1000000)?(' · <b style="color:var(--acc-d)">$'+Math.round(salv/1000)+'k</b>'):'';
    return `<div class="card" onclick="openJob('${esc(j.id)}')">
      <div class="card-top">
        <div class="title">${esc(j.title)}</div>
        <span class="src-badge" style="background:${sc}1a;color:${sc};border-color:${sc}55">${icon('external',11)} ${esc(j.source)}</span>
      </div>
      <div class="meta">${icon('building2',14)} <b>${esc(j.company||'—')}</b></div>
      <div class="meta">${icon('pin',14)} ${esc(j.location||'N/A')}${j.remote?' · <span class="pill-rem">🌍 remote</span>':''}${j.job_type?' · '+esc(j.job_type):''}${sal}</div>
      ${(j.tags&&j.tags.length)?`<div class="tags">${j.tags.slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      ${j.desc?`<div class="snip">${esc(j.desc.slice(0,150))}…</div>`:''}
      <div class="card-foot">
        <span class="foot-date">${j.date?icon('calendar',13)+' Posted '+esc(j.date):''}</span>
        <div class="card-actions" onclick="event.stopPropagation()">
          ${showMatch?`<span class="chip match ${j.match>=55?'good':(j.match>=30?'mid':'')}">${j.match}% ATS</span>`:''}
          <button class="btn-save ${saved?'on':''}" onclick="toggleSave('${esc(j.id)}')">${saved?icon('star',14)+' Saved':icon('bookmark',14)+' Save'}</button>
        </div>
      </div></div>`;
  }
  function openJob(id){
    const j=[...S.jobs,...S.saved].find(x=>x.id===id); if(!j) return;
    const saved=S.savedIds.has(id);
    $('modal').innerHTML=`<div class="modal-backdrop" onclick="closeModal()"></div><div class="modal-panel">
      <button class="modal-x" onclick="closeModal()">${icon('x',18)}</button>
      <h2>${esc(j.title)}</h2>
      <div class="modal-sub">${esc(j.company||'—')} · <span class="chip src">${esc(j.source)}</span></div>
      <div class="meta">${icon('pin',15)} ${esc(j.location||'N/A')}${j.remote?' · 🌍 remote':''}${j.job_type?' · '+esc(j.job_type):''}</div>
      ${(j.tags&&j.tags.length)?`<div class="tags">${j.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="modal-desc">${esc(j.desc||'No details available — click Apply to view the original posting.')}</div>
      <div class="modal-actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noreferrer">${icon('external',16)} Apply</a>
        <button class="btn ${saved?'accent':'outline'}" id="modal-save" onclick="toggleSave('${esc(id)}');closeModal();">${saved?icon('star',16)+' Saved':icon('bookmark',16)+' Save'}</button>
      </div></div>`;
    $('modal').classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeModal(){ $('modal').classList.remove('open'); $('modal').innerHTML=''; document.body.style.overflow=''; }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  /* ---------------- BOOT ---------------- */
  applyTheme();
  (async () => {
    if(S.token){ try{ const me=await api('/auth/me'); S.email=me.email; mountApp(); return; }
      catch(e){ S.token=''; localStorage.removeItem('jh_token'); } }
    mountAuth();
  })();
  </script>
</body>
</html>
